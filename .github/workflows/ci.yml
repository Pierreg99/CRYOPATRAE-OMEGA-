name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: ""

      - name: Syntax-check engine sources
        shell: bash
        run: |
          set -euo pipefail
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Syntax-check experiment harnesses
        shell: bash
        run: |
          set -euo pipefail
          find experiments -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Run offline core tests
        run: node test.mjs

      - name: Static web smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s README.md
          grep -q '<title>' index.html
          grep -q 'src/Glossopetrae.js' index.html

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed secrets and NUL bytes
        shell: bash
        run: |
          set -euo pipefail
          if git grep -Il '' -- . | xargs -r grep -Il $'\x00' >/dev/null; then
            echo "Unexpected NUL byte found in a text file."
            exit 1
          fi
          if git grep -nE 'OPENROUTER_API_KEY=(sk-|[A-Za-z0-9_-]{20,})' -- ':!README.md' ':!PAPER.md' ':!*.html'; then
            echo "Potential API credential committed to the repository."
            exit 1
          fi
